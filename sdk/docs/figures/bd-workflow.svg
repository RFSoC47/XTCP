<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 401" width="1050" height="401" role="img" aria-label="在 Vivado Block Design 中配置端点">
<title>在 Vivado Block Design 中配置端点</title><desc>以下步骤与随包的可执行 Tcl 示例指向同一组 IP 参数。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#126855" stroke-width="1.3"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif"><rect x="0" y="0" width="1050" height="401" rx="0" fill="#f8fafc" stroke="none"/><text x="32" y="48" font-size="27" font-weight="650" fill="#162f45" text-anchor="start">在 Vivado Block Design 中配置端点</text><text x="33" y="78" font-size="16" font-weight="400" fill="#4e6071" text-anchor="start">以下步骤与随包的可执行 Tcl 示例指向同一组 IP 参数。</text><rect x="30" y="118" width="285" height="201" rx="9" fill="#e4edf9" stroke="none"/><text x="48" y="153" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">添加 IP Repository</text><text x="48" y="184" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Project Settings → IP</text><text x="48" y="209" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Repository → Add</text><text x="48" y="234" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">选择解压包内的 ip_repo</text><text x="48" y="259" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">在 IP Catalog 搜索 XTCP</text><rect x="365" y="118" width="311" height="201" rx="9" fill="#e3f3ef" stroke="none"/><text x="383" y="153" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">设置 XTCP 实例</text><text x="383" y="184" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Add IP → XTCP → 双击实例</text><text x="383" y="209" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Line profile 选择 10G / 25G</text><text x="383" y="234" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">或选择 25G-Jumbo</text><text x="383" y="259" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">填入 MAC、IPv4 和端口</text><rect x="727" y="118" width="293" height="201" rx="9" fill="#fff0d8" stroke="none"/><text x="745" y="153" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">连接与生成</text><text x="745" y="184" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">检查用户数据宽度</text><text x="745" y="209" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">连接应用域与线侧域</text><text x="745" y="234" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Validate Design</text><text x="745" y="259" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">Generate Output Products</text><path d="M317 210 H359" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M678 210 H721" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="31" y="364" font-size="17" font-weight="400" fill="#23324a" text-anchor="start">打开保存的 .bd 后，双击 endpoint 可以重新查看配置。更改型号后检查时钟和所有用户数据线的宽度。</text></g></svg>