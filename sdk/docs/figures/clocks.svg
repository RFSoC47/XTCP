<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 347" width="1050" height="347" role="img" aria-label="时钟与跨域边界">
<title>时钟与跨域边界</title><desc>两个 25G 型号共享同一时钟结构。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#126855" stroke-width="1.3"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif"><rect x="0" y="0" width="1050" height="347" rx="0" fill="#f8fafc" stroke="none"/><text x="32" y="48" font-size="27" font-weight="650" fill="#162f45" text-anchor="start">时钟与跨域边界</text><text x="33" y="78" font-size="16" font-weight="400" fill="#4e6071" text-anchor="start">两个 25G 型号共享同一时钟结构。</text><rect x="31" y="112" width="286" height="153" rx="9" fill="#e4edf9" stroke="none"/><text x="49" y="147" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">10G 用户与线侧同域</text><text x="49" y="178" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">APP_CLK = LINE_CLK</text><text x="49" y="203" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">64 bit × 156.25 MHz</text><text x="49" y="228" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">共用同步释放的复位</text><rect x="368" y="112" width="290" height="153" rx="9" fill="#e3f3ef" stroke="none"/><text x="386" y="147" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">25G 应用 / 协议域</text><text x="386" y="178" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">APP_CLK = 195.3125 MHz</text><text x="386" y="203" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">128 bit × 195.3125 MHz</text><text x="386" y="228" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">用户数据与寄存器同域</text><rect x="714" y="112" width="305" height="153" rx="9" fill="#fff0d8" stroke="none"/><text x="732" y="147" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">25G XGMII 域</text><text x="732" y="178" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">LINE_CLK = 390.625 MHz</text><text x="732" y="203" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">64 bit × 390.625 MHz</text><text x="732" y="228" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">接入 PCS/PMA 的 MII 时钟</text><path d="M660 170 H706" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M706 193 H661" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="683" y="239" font-size="14" font-weight="650" fill="#126855" text-anchor="middle">FIFO</text><text x="33" y="312" font-size="17" font-weight="400" fill="#23324a" text-anchor="start">RDX051 示例使用 156.25 MHz GT 差分参考时钟。25G 的 APP_CLK 由示例板级 MMCM 生成。</text></g></svg>