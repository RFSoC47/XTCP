<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 458" width="1050" height="458" role="img" aria-label="一个 XTCP 实例如何连接到以太网">
<title>一个 XTCP 实例如何连接到以太网</title><desc>箭头表示载荷与协议帧的两个传输方向。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#126855" stroke-width="1.3"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif"><rect x="0" y="0" width="1050" height="458" rx="0" fill="#f8fafc" stroke="none"/><text x="32" y="48" font-size="27" font-weight="650" fill="#162f45" text-anchor="start">一个 XTCP 实例如何连接到以太网</text><text x="33" y="78" font-size="16" font-weight="400" fill="#4e6071" text-anchor="start">箭头表示载荷与协议帧的两个传输方向。</text><rect x="30" y="124" width="209" height="169" rx="9" fill="#e4edf9" stroke="none"/><text x="48" y="159" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">用户应用</text><text x="48" y="190" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">采集源 / 消费端</text><text x="48" y="215" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">TX 有效字节数</text><text x="48" y="240" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">RX 写口 / 读指针</text><rect x="279" y="104" width="318" height="213" rx="9" fill="#e3f3ef" stroke="none"/><text x="297" y="139" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">XTCP 源码 IP</text><text x="297" y="170" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">会话、ACK 与接收窗口</text><text x="297" y="195" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">发送留存 RAM / 乱序重排</text><text x="297" y="220" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">ARP / IPv4 / TCP / UDP 控制</text><text x="297" y="245" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">25G 通过 FIFO 跨时钟域</text><rect x="635" y="124" width="181" height="169" rx="9" fill="#fff0d8" stroke="none"/><text x="653" y="159" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">板级 PCS/PMA</text><text x="653" y="190" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">64 位 XGMII</text><text x="653" y="215" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">GT / 参考时钟</text><text x="653" y="240" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">复位与管脚约束</text><rect x="855" y="124" width="163" height="169" rx="9" fill="#e4edf9" stroke="none"/><text x="873" y="159" font-size="21" font-weight="650" fill="#103c38" text-anchor="start">以太网对端</text><text x="873" y="190" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">网口 / 光模块</text><text x="873" y="215" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">TCP socket</text><text x="873" y="240" font-size="16" font-weight="400" fill="#23324a" text-anchor="start">UDP 控制客户</text><path d="M240 201 H275" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M275 219 H240" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M598 201 H630" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M630 219 H598" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M817 201 H850" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M850 219 H817" fill="none" stroke="#126855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="30" y="350" width="988" height="80" rx="9" fill="#eef2f7" stroke="none"/><text x="49" y="381" font-size="16" font-weight="650" fill="#126855" text-anchor="start">公共边界</text><text x="49" y="409" font-size="17" font-weight="400" fill="#23324a" text-anchor="start">型号和网络身份在生成 IP / 综合时确定。板级示例把应用、协议核与一个物理端口接成完整链路。</text></g></svg>